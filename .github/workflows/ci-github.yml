name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: macOS
            os: macos-latest
            ocaml: 5.4
            test_disabled:
            # We exclude the coq-core package
            packages: ./rocq*.opam
          - name: Windows
            os: windows-latest
            ocaml: 4.14
            test_disabled: misc coq-makefile precomputed-time-tests
            # we don't support rocqide on Windows yet, so we filter it, see #20631
            packages: ./rocqide-server.opam ./rocq-*.opam
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5.4
            test_disabled:
            packages: ./rocq*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 🐛 Special macOS Config
        if: matrix.os == 'macos-latest'
        run: brew install gnu-time

      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      # Cygwin's pkgconf 3.0.4-1 (2026-07-26) compiles its personality search
      # path as /usr/lib/pkgconfig/personality.d:/usr/share/pkgconfig/personality.d
      # but still installs the mingw-w64 personality files under
      # /etc/pkgconfig/personality.d, so `pkgconf --personality=<triplet>`
      # silently falls back to the native personality and the
      # conf-mingw-w64-{gmp,zlib}-* opam packages fail their probes.  pkgconf
      # also searches $XDG_DATA_DIRS/pkgconfig/personality.d, so prepending /etc
      # restores the lookup.  Drop this once Cygwin ships a fixed pkgconf
      # packaging.
      - name: 🩹 Work around Cygwin pkgconf 3.0.4-1 personality path bug
        if: matrix.os == 'windows-latest'
        run: |
          "XDG_DATA_DIRS=/etc:/usr/local/share:/usr/share" >> $env:GITHUB_ENV

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: Enable native
        run: ./configure -relocatable -native-compiler yes

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'
